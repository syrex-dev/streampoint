<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img">
  <title>StreamPoint</title>
  <style>
    .sp-bg { fill: #0F4C5C; }
    .sp-dot { fill: #EA5A3A; }
    .sp-cursor { fill: #FFF4E6; stroke: #FFF4E6; stroke-width: 2.5; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .sp-bg { fill: #3CC0B0; }
      .sp-dot { fill: #FF7A5C; }
      .sp-cursor { fill: #0B2530; stroke: #0B2530; stroke-width: 2.5; stroke-linejoin: round; }
    }
  </style>
  <rect class="sp-bg" x="6" y="6" width="52" height="52" rx="14"/>
  <circle class="sp-dot" cx="24" cy="15" r="6.5"/>
  <polygon class="sp-cursor" points="24,15 24,48 32,41 38,53 44,50 38,38 49,38"/>
</svg>
